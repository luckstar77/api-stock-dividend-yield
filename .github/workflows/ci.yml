name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The server runs Node.js 20 (see README)
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-api
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy secrets
        id: secrets
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::notice title=Deploy skipped::Set the EC2_HOST, EC2_USER and EC2_SSH_KEY secrets (Settings > Secrets and variables > Actions) to deploy to the server. See README > CI/CD."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          # Optional: the server's line from known_hosts. Without it the host key is read with ssh-keyscan.
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$EC2_HOST_KEY" ]; then
            printf '%s\n' "$EC2_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy
        if: steps.secrets.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 "$EC2_USER@$EC2_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' APP_DIR='$EC2_APP_DIR' bash -s" < deploy/deploy.sh

      - name: Remove the SSH key
        if: always() && steps.secrets.outputs.configured == 'true'
        run: rm -f ~/.ssh/deploy_key
